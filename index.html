<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打字训练 · Typing Trainer</title>
<style>
  @font-face{
    font-family:"公众号-犬神志";
    src:url("assets/font.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
    /* 苹方风格字库；font-display:swap 保证首帧系统字体、加载后无缝切换苹方 */
  }
  :root{
    color-scheme:light dark;
    --bg:#eef2f8; --panel:rgba(255,255,255,.72); --panel2:rgba(255,255,255,.5);
    --text:#1e293b; --muted:#64748b;
    --ok:#16a34a; --err:#dc2626; --accent:#0284c7;
    --border:rgba(100,116,139,.18);
    --dot:#1e293b;
    --navbg:rgba(238,242,248,.72);
    --glass-blur:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f172a; --panel:rgba(30,41,59,.55); --panel2:rgba(30,41,59,.3);
      --text:#e2e8f0; --muted:#94a3b8;
      --ok:#22c55e; --err:#ef4444; --accent:#38bdf8;
      --border:rgba(148,163,184,.16);
      --dot:#e2e8f0;
      --navbg:rgba(15,23,42,.6);
    }
  }
  :root[data-theme="light"]{
    --bg:#eef2f8; --panel:rgba(255,255,255,.72); --panel2:rgba(255,255,255,.5);
    --text:#1e293b; --muted:#64748b;
    --ok:#16a34a; --err:#dc2626; --accent:#0284c7;
    --border:rgba(100,116,139,.18);
    --dot:#1e293b;
    --navbg:rgba(238,242,248,.72);
  }
  :root[data-theme="dark"]{
    --bg:#0f172a; --panel:rgba(30,41,59,.55); --panel2:rgba(30,41,59,.3);
    --text:#e2e8f0; --muted:#94a3b8;
    --ok:#22c55e; --err:#ef4444; --accent:#38bdf8;
    --border:rgba(148,163,184,.16);
    --dot:#e2e8f0;
    --navbg:rgba(15,23,42,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    background-image:
      radial-gradient(1200px 600px at 10% -10%, rgba(2,132,199,.25), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(34,197,94,.18), transparent 55%),
      radial-gradient(900px 700px at 50% 115%, rgba(168,85,247,.14), transparent 60%);
    background-attachment:fixed;
  }
  /* 深浅色切换：模糊过渡（只过渡背景色/文字色，避免触发重绘卡顿） */
  body, .mode-btn, .stat, .target-wrap, .now-badge, .nk, .analysis, .btn, .result-card, #ghi{
    transition: background-color .3s ease, color .3s ease, border-color .3s ease;
  }
  body{
    transition: background-color .3s ease;
  }

  /* 毛玻璃通用卡片 */
  .glass{
    background:var(--panel);
    backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 8px 30px rgba(2,6,23,.08);
  }
  header{
    padding:16px 18px 14px; text-align:center;
    position:sticky; top:0; z-index:10;
    background:var(--navbg);
    backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    border-bottom:1px solid var(--border);
  }
  header .hd-row{ display:flex; align-items:center; justify-content:center; position:relative; }
  header h1{
    font-size:16px; letter-spacing:.6px; font-weight:500;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
  }
  /* 去掉第二排介绍 */
  main{flex:1; padding:16px; max-width:760px; width:100%; margin:0 auto;}

  /* 关卡进度条 */
  .levelbar{
    margin-bottom:14px; border-radius:16px; padding:12px 14px;
  }
  .lv-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .lv-badge{
    display:inline-flex; align-items:center; gap:8px;
    font-size:15px; font-weight:600; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
  }
  .lv-num{
    font-size:12px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,var(--accent),#38bdf8);
    padding:3px 9px; border-radius:99px; letter-spacing:.5px;
  }
  .lv-name{} 
  .lv-count{ font-size:12px; color:var(--muted); }
  .lv-dots{ display:flex; gap:8px; margin-bottom:10px; }
  .lv-dot{
    flex:1; height:30px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel2); color:var(--muted); font-size:12px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background-color .2s, color .2s, border-color .2s, transform .15s;
  }
  .lv-dot.active{
    background:linear-gradient(135deg,var(--accent),#38bdf8);
    color:#fff; border-color:transparent; font-weight:600;
    box-shadow:0 3px 10px rgba(2,132,199,.35);
  }
  .lv-dot.done{ background:var(--panel2); color:var(--ok); border-color:var(--ok); }
  .lv-dot:active{ transform:scale(.94); }
  .lv-prog-wrap{ display:flex; align-items:center; gap:10px; }
  .lv-track{ flex:1; height:6px; border-radius:99px; background:var(--panel2); overflow:hidden; }
  .lv-fill{
    height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--accent),#38bdf8);
    transition:width .5s ease;
  }
  .lv-goal{ font-size:12px; color:var(--muted); white-space:nowrap; }

  .modes{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .mode-btn{
    flex:1 1 auto; min-width:88px; padding:11px 6px; border:1px solid var(--border);
    background:var(--panel); color:var(--muted); border-radius:12px;
    font-size:14px; cursor:pointer; transition:.15s; white-space:nowrap;
    backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
  }
  .mode-btn.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:500;}

  .stats{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;
  }
  .stat{background:var(--panel); border-radius:12px; padding:10px 6px; text-align:center;
    backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
    border:1px solid var(--border); box-shadow:0 6px 20px rgba(2,6,23,.06);}
  .stat .num{font-size:20px; font-weight:500; color:var(--accent);
    font-family:"公众号-犬神志",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;}
  .stat .lab{font-size:11px; color:var(--muted); margin-top:2px;}
  .pct{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; font-size:.75em; font-weight:700;}

  /* 主题切换按钮：极简小圆点 */
  .theme-toggle{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; padding:0;
    background:var(--dot);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background-color .3s ease, transform .15s ease;
  }
  .theme-toggle:active{transform:translateY(-50%) scale(.82);}

  .target-wrap{
    font-family:"公众号-犬神志",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:12px; min-height:80px;
    font-size:20px; line-height:1.8; letter-spacing:.5px; word-break:break-all;
    user-select:none;
    backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
    box-shadow:0 8px 24px rgba(2,6,23,.06);
  }
  .target-wrap .done{color:#475569;}
  .target-wrap .cur{background:var(--accent); color:#fff; border-radius:3px;}
  .target-wrap .curword{
    display:inline-block; background:var(--accent); color:#fff;
    padding:2px 8px; border-radius:8px; letter-spacing:1px;
  }
  .target-wrap .good{color:var(--ok);}
  .target-wrap .bad{color:var(--err); background:rgba(239,68,68,.15); border-radius:3px;}

  /* 输入提示区：词语模式显示当前要打的词，其余显示已输入原文 */
  .now-badge{
    font-family:"公众号-犬神志",-apple-system,"PingFang SC",sans-serif;
    text-align:center; font-size:15px; color:var(--accent);
    background:var(--panel2); border:1px dashed var(--accent);
    border-radius:10px; padding:8px; margin-bottom:10px; min-height:20px;
    font-weight:500; letter-spacing:1px; word-break:break-all;
  }

  /* 九键键盘可视化 */
  .nine-key{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    margin-bottom:14px;
  }
  .nk{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:10px 4px; text-align:center; transition:.15s;
    font-family:"公众号-犬神志",-apple-system,"PingFang SC",sans-serif;
    backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
  }
  .nk .l{font-size:17px; font-weight:500; color:var(--accent);}
  .nk .c{font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:1px;}
  .nk.hot{background:var(--accent); border-color:var(--accent);}
  .nk.hot .l,.nk.hot .c{color:#fff;}
  .nk.dim{opacity:.35;}

  .input-zone{margin-bottom:14px;}
  #ghi{
    width:100%; height:52px; font-size:18px; padding:0 12px;
    background:var(--panel); color:var(--text);
    border:2px solid var(--accent); border-radius:12px; outline:none;
    caret-color:var(--accent);
    box-shadow:0 6px 20px rgba(2,6,23,.06);
  }
  #ghi::placeholder{color:var(--muted); opacity:.8;}
  .keyboard-hint{font-size:11px; color:var(--muted); margin-top:6px;}

  .analysis{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin-bottom:14px;
    backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
    box-shadow:0 8px 24px rgba(2,6,23,.06);
  }
  .analysis h3{font-size:14px; color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .analysis .err-list{list-style:none;}
  .analysis .err-list li{
    background:var(--panel2); border-radius:8px; padding:8px 12px; margin-bottom:6px;
    font-size:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .analysis .err-list .why{color:var(--muted); font-size:12px; flex:1 1 100%;}
  .err-char{color:var(--err); font-weight:500;}
  .exp-char{color:var(--ok); font-weight:500;}
  .empty-note{color:#475569; font-size:13px;}
  .warn-note{color:#f59e0b; font-size:12px; margin-top:4px;}

  .btns{display:flex; gap:10px;}
  .btn{
    flex:1; padding:13px; border:none; border-radius:12px; font-size:15px; font-weight:500; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:var(--panel); color:var(--muted); border:1px solid var(--border);}

  .result{
    display:none; position:fixed; inset:0;
    background:rgba(2,6,23,.45);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .result.show{display:flex;}
  .result-card{
    background:var(--panel); border:1px solid var(--accent); border-radius:18px;
    padding:28px 24px; max-width:340px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(2,6,23,.4);
  }
  /* 过关弹窗：从小变大动画 */
  .result-card{ transform:scale(.82); opacity:0; transition:transform .28s cubic-bezier(.34,1.56,.64,1), opacity .22s ease; }
  .result.show .result-card{ transform:scale(1); opacity:1; }
  .result-card h2{font-size:22px; margin-bottom:8px; color:var(--accent);}
  .grade{font-size:44px; font-weight:500; color:var(--accent); margin:6px 0 2px; letter-spacing:2px;
    font-family:"公众号-犬神志",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;}
  .motto{font-size:14px; color:var(--muted); margin-bottom:16px; line-height:1.6;}
  .result-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
  .result-grid .cell{background:var(--panel2); border-radius:12px; padding:14px 8px;}
  .result-grid .cell .n{font-size:24px; font-weight:500;
    font-family:"公众号-犬神志",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;}
  .result-grid .cell .t{font-size:12px; color:var(--muted); margin-top:2px;}

  footer{padding:14px; text-align:center; font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<header>
  <div class="hd-row">
    <button class="theme-toggle" id="theme-toggle" title="切换深浅色" aria-label="切换深浅色"></button>
    <h1>Typing Trainer</h1>
  </div>
</header>

<main>
  <div class="levelbar glass">
    <div class="lv-top">
      <div class="lv-badge"><span class="lv-num" id="lv-now">第 1 关</span><span class="lv-name" id="lv-name">新手上路</span></div>
      <div class="lv-count" id="lv-count">1 / 5</div>
    </div>
    <div class="lv-dots" id="lv-dots"></div>
    <div class="lv-prog-wrap">
      <div class="lv-track"><div class="lv-fill" id="lv-fill" style="width:0%"></div></div>
      <div class="lv-goal" id="lv-goal">再完成 3 轮升到下一关</div>
    </div>
  </div>

  <div class="modes">
    <button class="mode-btn active" data-mode="words">词语</button>
    <button class="mode-btn" data-mode="sentences">句子</button>
    <button class="mode-btn" data-mode="passage">长段</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="st-pace">0</div><div class="lab">字/分</div></div>
    <div class="stat"><div class="num" id="st-acc">100%</div><div class="lab">正确率</div></div>
    <div class="stat"><div class="num" id="st-prog">0%</div><div class="lab">进度</div></div>
    <div class="stat"><div class="num" id="st-errs">0</div><div class="lab">错误</div></div>
  </div>

  <div class="now-badge" id="now-badge"></div>

  <div class="target-wrap" id="target"></div>

  <div class="input-zone">
    <input type="text" id="ghi" autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" inputmode="text" placeholder="点击这里开始打字…" />
    <div class="keyboard-hint">↓ 点击输入框会弹出手机系统键盘，直接打字即可</div>
  </div>

  <div class="analysis">
    <h3>🧐 实时纠错分析</h3>
    <ul class="err-list" id="err-list">
      <li class="empty-note">还没有错误，继续保持 ✨</li>
    </ul>
  </div>

  <div class="nine-key" id="nine-key">
    <div class="nk" data-key="1"><div class="l">1</div><div class="c">.,?!</div></div>
    <div class="nk" data-key="2"><div class="l">2</div><div class="c">ABC</div></div>
    <div class="nk" data-key="3"><div class="l">3</div><div class="c">DEF</div></div>
    <div class="nk" data-key="4"><div class="l">4</div><div class="c">GHI</div></div>
    <div class="nk" data-key="5"><div class="l">5</div><div class="c">JKL</div></div>
    <div class="nk" data-key="6"><div class="l">6</div><div class="c">MNO</div></div>
    <div class="nk" data-key="7"><div class="l">7</div><div class="c">PQRS</div></div>
    <div class="nk" data-key="8"><div class="l">8</div><div class="c">TUV</div></div>
    <div class="nk" data-key="9"><div class="l">9</div><div class="c">WXYZ</div></div>
  </div>

  <div class="btns">
    <button class="btn btn-ghost" id="btn-restart">重新开始</button>
    <button class="btn btn-primary" id="btn-skip">换一段</button>
  </div>
</main>

<div class="result" id="result">
  <div class="result-card">
    <h2>🎉 完成！</h2>
    <div class="grade" id="r-grade">A</div>
    <div class="motto" id="r-motto"></div>
    <div class="result-grid">
      <div class="cell"><div class="n" id="r-pace">0</div><div class="t">字/分</div></div>
      <div class="cell"><div class="n" id="r-acc">100%</div><div class="t">正确率</div></div>
      <div class="cell"><div class="n" id="r-time">0s</div><div class="t">用时</div></div>
      <div class="cell"><div class="n" id="r-errs">0</div><div class="t">总错误</div></div>
    </div>
    <div class="btns">
      <button class="btn btn-ghost" onclick="closeResult()">取消</button>
      <button class="btn btn-primary" id="btn-again">再来一次</button>
    </div>
  </div>
</div>

<footer>Typing Trainer</footer>

<script>
/* ============ 主题：自动深浅色 + 手动覆盖 ============ */
(function(){
  const ROOT=document.documentElement;
  const KEY="tp-theme";
  const btn=document.getElementById("theme-toggle");
  const stored=localStorage.getItem(KEY);
  if(stored==="light"||stored==="dark"){
    ROOT.setAttribute("data-theme",stored);
  }
  function syncBtn(){}
  if(btn){
    btn.addEventListener("click",function(){
      const cur=ROOT.getAttribute("data-theme")
        || (window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
      const next= cur==="dark" ? "light" : "dark";
      ROOT.setAttribute("data-theme",next);
      localStorage.setItem(KEY,next);
      syncBtn();
    });
    syncBtn();
  }
})();

/* ============ 素材库 ============ */
const WORDS=[
  ["苹果","香蕉","橘子","葡萄","西瓜","草莓","蓝莓","樱桃","芒果","菠萝","荔枝","龙眼","柚子","椰子","柠檬","石榴"],
  ["红色","蓝色","绿色","黄色","紫色","粉色","黑色","白色","灰色","橙色","金色","银色","棕色","青色","玫红","米白"],
  ["学习","工作","阅读","写作","思考","记忆","练习","坚持","专注","高效","勤奋","耐心","毅力","态度","目标","计划"],
  ["电脑","手机","键盘","屏幕","鼠标","网络","程序","网站","数据","代码","软件","硬件","算法","接口","插件","缓存"],
  ["清晨","午后","黄昏","深夜","春夏","秋冬","过去","现在","未来","当下","昨天","今天","明天","时光","岁月","季节"],
  ["饺子","面条","米饭","包子","馒头","油条","豆浆","鸡蛋","牛奶","面包","火锅","烧烤","蛋糕","糖果","冰淇淋","巧克力"],
  ["快乐","幸福","开心","喜悦","满足","感动","温暖","希望","梦想","勇气","自信","善良","真诚","宽容","乐观","豁达"],
  ["跑步","游泳","篮球","足球","羽毛球","乒乓球","骑车","登山","瑜伽","太极","跳绳","跳远","举重","滑冰","滑雪","慢走"],
  ["春天","夏天","秋天","冬天","春风","夏雨","秋叶","冬雪","阳光","月光","星光","朝霞","晚霞","彩虹","雷雨","清风"],
  ["海洋","森林","沙漠","草原","高山","河流","湖泊","瀑布","岛屿","冰川","峡谷","丘陵","平原","盆地","沼泽","湿地"],
  ["点赞","关注","转发","收藏","评论","弹幕","刷屏","硬核","离谱","上头","绝了","破防","emo","躺平","内卷","摆烂"],
  ["奶茶","可乐","咖啡","果汁","汽水","酸奶","豆浆","柠檬水","蜂蜜","果汁","凉茶","椰子水","白开水","抹茶","拿铁","美式"],

           goal:LEVELS[lv-1].words,

}
function renderLevel(){
  const li=levelInfo();
  const L=LEVELS[lv-1];
  const GOAL_ROUNDS=3;
  const el=document.getElementById("lv-now");
  const nameEl=document.getElementById("lv-name");
  const countEl=document.getElementById("lv-count");

    if(lv>=LEVELS.length && left<=0) goal.textContent="已通关！可挑战任意关卡";

/* --- 工具 --- */
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function isCJK(ch){ return /[\u4e00-\u9fff\u3400-\u4dbf]/.test(ch); }
function isPunct(ch){ return /[，。、；：？！“”‘’《》（）…—·,.?!;:'"()\-—\s，。]/.test(ch); }
/* 一个字符是否是本段"合法输出字符"（中文字/目标出现的标点/空格） */
function makeAllowedSet(){
  const s=new Set();
  for(const c of text){ s.add(c); }
  return s;
}
let allowed=null;
let pendingPinyin="";

/* --- 解析目标为"判定单元" --- */
function buildItems(){
  items=[];
  if(mode==="words"){
    // 词数组已是打好的词序列，直接照录（可重复随机抽取）
    items = text.replace(/\s+/g," ").trim().split(" ").map(w=>w.trim()).filter(Boolean);
    itemMode=true;
    // chars 用于渲染整段
    chars = text.split("");
  }else{
    // 句子/长段：逐字单元
    chars = text.split("");
    items = chars.map(c=>c);
    itemMode=false;
  }
}

/* --- 初始化/切换 --- */
function pickText(){
  const L=LEVELS[lv-1];
  if(mode==="words"){
    // 每个词条数组都是一个主题，随机选主题后打乱，按该关词数截取
    const arr0=WORDS[Math.floor(Math.random()*WORDS.length)];
    const arr=arr0.slice().sort(()=>Math.random()-.5).slice(0, L.words);
    return arr.join(" ");
  }else if(mode==="sentences"){
    const pool= L.sent==="SIMPLE" ? SENT_SIMPLE : (L.sent==="HARD" ? SENT_HARD : SENT_MID);
    return pool[Math.floor(Math.random()*pool.length)];
  }else{
    const pool= L.pass==="SHORT" ? PASS_SHORT : (L.pass==="LONG" ? PASS_LONG : PASS_MID);
    return pool[Math.floor(Math.random()*pool.length)];
  }
}
function startNew(){
  text=pickText();
  allowed=makeAllowedSet();
  pendingPinyin="";
  buildItems();
  pos=0; errCount=0; errMap={}; lastTime=null;
  startTime=Date.now();
  g.value="";
  render();
  updateBadge("");
  renderLevel();
  g.focus();
}
function reset(){
  pendingPinyin="";

}

/* --- 渲染目标文本 --- */
function render(){
  let html="";
  if(itemMode){
    // 词语模式：逐词渲染，当前待打词整体合并成一个圆角矩形，而非逐字各自高亮
    for(let w=0;w<items.length;w++){
      const wi=items[w];
      const isDone = w<pos;
      const isCur = w===pos;
      // 拼当前/待打词的字符 html（去掉内部空格显示）
      let inner="";
      for(let k=0;k<wi.length;k++){
        const c=wi[k];
        if(c===" "||c==="\u3000"){ continue; }
        inner+=escapeHtml(c);
      }
      if(isDone){ html+=`<span class="done">${inner}</span>`; }
      else if(isCur){ html+=`<span class="curword">${inner}</span>`; }
      else { html+=inner; }
      if(w<items.length-1) html+="&nbsp;"; // 词间空格
    }
  } else {
    // 句子/长段：逐字，当前位置高亮
    for(let i=0;i<chars.length;i++){
      const c=chars[i];
      const isSpace=c===" "||c==="\u3000";
      const esc=isSpace?"&nbsp;":escapeHtml(c);
      let cls="";
      if(i<pos) cls="done";
      else if(i===pos) cls="cur";
      html+=`<span class="${cls}">${esc}</span>`;
    }
  }
  targetEl.innerHTML=html;
  updateStats();
}

/* --- 统计 --- */
function typedTotalChars(){
  // 已正确完成的字符总数（用于速度/进度/正确率）
  if(itemMode){
    let n=0; for(let i=0;i<pos;i++) n+=items[i].length;
    return n;
  }
  return pos;
}
function updateStats(){
  const now=Date.now();
  const typed=typedTotalChars();
  const total = itemMode
    ? items.reduce((a,w)=>a+(w?w.length:0),0)
    : chars.length;
  const seg=(now-startTime)/1000;
  const pace = seg>0 && typed>0 ? Math.round(typed/(seg/60)) : 0;
  const prog= total? Math.round(typed/total*100):0;
  const acc = typed+errCount>0 ? Math.max(0,Math.round(typed/(typed+errCount)*100)) : 100;
  document.getElementById("st-pace").textContent=pace;
  document.getElementById("st-acc").innerHTML=acc+'<span class="pct">%</span>';
  document.getElementById("st-prog").innerHTML=prog+'<span class="pct">%</span>';
  document.getElementById("st-errs").textContent=errCount;
}

/* --- 九键键盘高亮：根据正输入的拼音字母，高亮对应键位 --- */
const NK_MAP={};(function(){
  const K={"abc":"2","def":"3","ghi":"4","jkl":"5","mno":"6","pqrs":"7","tuv":"8","wxyz":"9"};
  for(const [letters,dig] of Object.entries(K)){
    for(const L of letters) NK_MAP[L]=dig;
  }
})();
const nkEl=document.getElementById("nine-key");
function updateNineKey(letters){
  if(!nkEl) return;
  const ascii=(letters||"").toLowerCase().replace(/[^a-z]/g,"");
  const hotSet=new Set();
  for(const L of ascii){ if(NK_MAP[L]) hotSet.add(NK_MAP[L]); }
  nkEl.querySelectorAll(".nk").forEach(k=>{
    const key=k.dataset.key;
    const isHot=hotSet.has(key);
    k.classList.toggle("hot",isHot);
    k.classList.toggle("dim", ascii.length>0 && !isHot);
  });
}
/* 九键高亮双通道：keydown 捕获物理键位（含输入法合成态），input 兜底 */
function nineKeyOnKey(e){
  const k=(e.key||"");
  if(k && /^[a-zA-Z]$/.test(k)) updateNineKey(k);
}
function nineKeyClear(){ updateNineKey(""); }

/* --- 输入处理（核心：差量比对 + 拼音免疫 + 输入法合成安全） --- */
let lastValue="";
let composing=false;
let preComposeLen=0;
function processChars(added){
  for(const ch of added){
    if(ch==="\n"){ continue; }
    if(isCJK(ch) || isPunct(ch)){
      // 中文输出（候选上屏）——作为真正输入处理
      handleRealChar(ch);
    } else {
      // 非中文输出：可能是拼音预选字母 / 空格确认 / 数字
      // 空格：拼音输入法里常作为"确认候选"，忽略即可；其他字母忽略（拼音缓冲）
      // 若允许集里含该字符（如英文/数字目标），才当真实输入
      if(allowed.has(ch)){
        handleRealChar(ch);
      }
    }
  }
}
function onInput(){
  lastTime=Date.now();
  if(!startTime) startTime=lastTime;

  const val=g.value;
  // 输入法合成中：只同步基线，等 compositionend 统一提交，避免差量错位
  if(composing){ lastValue=val; return; }
  // 1) 用户删除了字符（回退）
  if(val.length < lastValue.length){
    // 撤销：我们不管拼音缓冲，直接回退 pendingPinyin 与 pending 展示
    pendingPinyin="";
    g.value="";
    lastValue="";
    render();
    updateBadge("");
    return;
  }
  // 2) 新增内容 = val 相比 lastValue 的尾巴
  const added = val.slice(lastValue.length);
  lastValue=val;
  updateNineKey(val);
  processChars(added);
  // 清空输入框，避免累积
  if(g.value.length> (itemMode? items[pos]?.length||40 : 6)){
    g.value=""; lastValue="";
  }
}
function onCompositionStart(){
  composing=true;
  preComposeLen=g.value.length;
}
function onCompositionEnd(){
  composing=false;
  const val=g.value;
  if(val.length>=preComposeLen){
    const committed=val.slice(preComposeLen);
    lastValue=val;
    updateNineKey(committed);
    if(committed) processChars(committed);
  } else {
    lastValue=val;
  }
  if(g.value.length> (itemMode? items[pos]?.length||40 : 6)){
    g.value=""; lastValue="";
  }
  requestAnimationFrame(nineKeyClear);
}

function handleRealChar(ch){
  if(finished){ return; }
  if(!lastTime) lastTime=Date.now();

  const total = itemMode
    ? items.reduce((a,w)=>a+(w?w.length:0),0)  // 只算词内字符，不含词间空格
    : chars.length;
  const typed=typedTotalChars();
  if(typed>=total){ finish(); return; }

  // 判断本单元应有的字符
  let expected;
  const eq = (a,b)=> (typeof a==="string"&&typeof b==="string" && /[a-zA-Z0-9]/.test(a)&&/[a-zA-Z0-9]/.test(b))
    ? a.toLowerCase()===b.toLowerCase()
    : (a===b);
  if(itemMode){
    if(pos<items.length){ expected=items[pos]; }
    else { finish(); return; }
    // 词语模式：比对整词（忽略大小写差异）
    const word=expected;
    currentWordInput += ch;
    const ciw = word.toLowerCase();
    const ck = currentWordInput.toLowerCase();
    if(word.length===1){
      if(eq(ch,word[0])){ itemOk(); }
      else { onWordErr(word, ch, currentWordInput); }
      currentWordInput="";
      return;
    }
    if(ck === ciw){
      itemOk(); currentWordInput="";
    } else if(ciw.startsWith(ck)){
      updateBadge(currentWordInput);
    } else {
      onWordErr(word, ch, currentWordInput);
      currentWordInput="";
    }
    return;
  } else {
    expected=chars[pos];
    if(eq(ch,expected)){
      pos++;
      render();
      updateBadge(ch);
      // 句子/长段：打完最后一个字立即触发完成，无需再补字符
      if(pos>=chars.length){ finish(); }
    }else{
      onCharErr(expected, ch);
      render();
    }
    return;
  }
}

/* 整词正确：pos 前进一个词 */
let currentWordInput="";
function itemOk(){
  pendingPinyin="";
  pos++;
  currentWordInput="";
  render();
  updateBadge("");
  // 打完最后一个词立即触发完成，无需再补一个字符
  const total = itemMode
    ? items.reduce((a,w)=>a+(w?w.length:0),0)
    : chars.length;
  if(pos>=items.length || typedTotalChars()>=total){ finish(); }
}
function onWordErr(word, ch, inputSoFar){
  errCount++;
  const shown = ch ? ch : "(已输入:"+inputSoFar+")";
  const key=word+"→"+shown;
  errMap[key]=(errMap[key]||0)+1;
  pendingPinyin="";
  currentWordInput="";
  g.value=""; lastValue="";
  render();
  updateErrors();
  updateBadge("");
}
function onCharErr(exp, got){
  errCount++;
  const key=exp+"→"+got;
  errMap[key]=(errMap[key]||0)+1;
  pendingPinyin="";
  g.value=""; lastValue="";
  render();
  updateErrors();
}
function updateBadge(str){
  if(itemMode){
    const w = pos<items.length? items[pos] : "";
    badgeEl.textContent = w? ("请打：『"+w+"』"+(str? "｜已输入 "+str : "")) : "已完成";
  } else {
    const w = pos<chars.length? chars[pos] : "";
    badgeEl.textContent = w!=null? ("请打：『"+w+"』"+(str? "｜已输入 "+str : "")) : "已完成";
  }
}

/* --- 错误面板 --- */
function updateErrors(){
  const list=document.getElementById("err-list");
  const keys=Object.keys(errMap);
  if(keys.length===0){
    list.innerHTML='<li class="empty-note">还没有错误，继续保持 ✨</li>';
    return;
  }
  list.innerHTML="";
  keys.slice(0,6).forEach(k=>{
    const arrow=k.indexOf("→");
    const exp=k.slice(0,arrow), got=k.slice(arrow+1);
    const li=document.createElement("li");
    li.innerHTML=`<span>应打 <span class="exp-char">${escapeHtml(exp)}</span>，打成 <span class="err-char">${escapeHtml(got)}</span>，共 ${errMap[k]} 次</span>
      <span class="why">提示：注意字符“${escapeHtml(exp)}”的键位</span>`;
    list.appendChild(li);
  });
}

/* --- 完成 --- */
let finished=false;
function gradeAndMotto(pace, acc){
  let g, m;
  if(acc===100){
    if(pace>=80){ g="S"; m="夯爆了！又快又准，你天生就是打字的料 🔥"; }
    else if(pace>=50){ g="A"; m="全对！速度快一点你就是王者了，稳得一批 💪"; }
    else if(pace>=30){ g="A-"; m="全对很棒，再加快点节奏就起飞了 ✨"; }
    else { g="B+"; m="一个不错，慢慢提速，稳扎稳打 🦞"; }
  } else if(acc>=95){ g="A"; m="几乎全对，手感和耐心都拉满了，牛！ 🌟"; }
  else if(acc>=85){ g="B"; m="有点小错，但整体稳了，集中精神更上一层楼 💪"; }
  else if(acc>=70){ g="C"; m="错误有点多，别急，慢一点打准一点 😌"; }
  else if(acc>=50){ g="D"; m="错了不少，建议放慢速度，先求准再求快 🐢"; }
  else { g="E"; m="拉完了……没事，重在练，重新来过找找手感 😅"; }
  return [g,m];
}
function finish(){
  if(finished) return;
  finished=true;
  const now=Date.now();
  const secs=Math.max(1,Math.round((now-startTime)/1000));
  const total=typedTotalChars();
  const pace=secs>0? Math.round(total/(secs/60)) : 0;
  const acc= total+errCount>0 ? Math.round(total/(total+errCount)*100):100;
  const [g,m]=gradeAndMotto(pace,acc);
  document.getElementById("r-pace").textContent=pace;
  document.getElementById("r-acc").innerHTML=acc+'<span class="pct">%</span>';
  document.getElementById("r-time").innerHTML=secs+'<span class="pct">s</span>';
  document.getElementById("r-errs").textContent=errCount;
  document.getElementById("r-grade").textContent=g;
  document.getElementById("r-motto").textContent=m;

  /* 推进关卡：每完成一轮 +1，满 3 轮自动升一关 */
  const GOAL_ROUNDS=3;
  lvProg++;
  let leveledUp=false;
  if(lvProg>=GOAL_ROUNDS && lv<LEVELS.length){ lv++; lvProg=0; leveledUp=true; }
  saveLevel();
  renderLevel();
  if(leveledUp){
    document.getElementById("r-motto").textContent = "升到第 "+lv+" 关「"+levelInfo().name+"」！"+m;
    // 升关后立即换更难的下一轮
    const nextMode=mode;
    setTimeout(()=>{ finished=false; currentWordInput=""; mode=nextMode; startNew(); },0);
  }

  document.getElementById("result").classList.add("show");
  g.blur();
}
function finishClose(){
  const r=document.getElementById("result");
  if(r) r.classList.remove("show");
}
function closeResult(){
  finishClose();
  g.focus();
}

/* ============ 按钮/事件 ============ */
g.addEventListener("input", onInput);
g.addEventListener("compositionstart", onCompositionStart);
g.addEventListener("compositionend", onCompositionEnd);
g.addEventListener("keydown", nineKeyOnKey);
g.addEventListener("blur", nineKeyClear);
document.querySelectorAll(".mode-btn").forEach(b=>{
  b.addEventListener("click",function(){
    document.querySelectorAll(".mode-btn").forEach(x=>x.classList.remove("active"));
    this.classList.add("active");
    mode=this.dataset.mode;
    finished=false;
    currentWordInput="";
    startNew();
  });
});
document.getElementById("btn-restart").addEventListener("click",()=>{ finished=false; currentWordInput=""; reset(); g.focus(); });
document.getElementById("btn-skip").addEventListener("click",()=>{ finished=false; currentWordInput=""; startNew(); });
targetEl.addEventListener("click",()=>g.focus());
document.getElementById("btn-again").addEventListener("click",()=>{
  document.getElementById("result").classList.remove("show");
  finished=false; currentWordInput="";
  startNew();
});

/* 启动 */
finished=false;
currentWordInput="";
loadLevel();
startNew();
</script>
